<div class="button-bar">
  <button mat-icon-button [ngClass]="app.digitCssClass(digit)" [disabled]="app.digitCssClass(digit).exhaustedDigit" class="digit"
    *ngFor="let digit of [1, 2, 3, 4, 5, 6, 7, 8, 9]" (click)="app.digitClicked(digit)">{{ digit }}</button>
  <button mat-icon-button [ngClass]="app.digitCssClass(0)" class="digit" (click)="app.candidatesClicked()" matTooltip="{{'editCandidates' | translate}}">
    <mat-icon>edit</mat-icon>
  </button>
  <button mat-icon-button [ngClass]="app.digitCssClass(0)" class="digit" (click)="app.undoClicked()" matTooltip="{{'undo' | translate}}">
    <mat-icon>undo</mat-icon>
</button>
</div>
