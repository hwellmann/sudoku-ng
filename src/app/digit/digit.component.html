<div class="digit-pad">
  <button mat-icon-button [ngClass]="app.digitCssClass(digit)" [disabled]="app.digitCssClass(digit).exhaustedDigit" class="digit"
    *ngFor="let digit of [1, 2, 3, 4, 5, 6, 7, 8, 9]" (click)="app.digitClicked(digit)">{{ digit }}</button>
  <button mat-icon-button [ngClass]="app.digitCssClass(0)" class="digit" (click)="app.candidatesClicked()">C</button>
  <button mat-icon-button [ngClass]="app.digitCssClass(0)" class="digit" (click)="app.checkpointClicked()">S</button>
  <button mat-icon-button [ngClass]="app.digitCssClass(0)" class="digit" (click)="app.revertClicked()">R</button>
</div>
