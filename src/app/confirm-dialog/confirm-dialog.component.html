<h2 mat-dialog-title>{{ data.titleKey | translate }}</h2>
<mat-dialog-content>
  {{ "confirmDiscardGame" | translate }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    {{ "cancel" | translate }}
  </button>
  <button mat-flat-button [mat-dialog-close]="true">
    {{ "confirm" | translate }}
  </button>
</mat-dialog-actions>
