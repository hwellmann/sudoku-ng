<mat-sidenav-container fullscreen>
    <mat-sidenav #sidenav (click)="sidenav.toggle()">
        <sudoku-sidenav></sudoku-sidenav>
    </mat-sidenav>
    <mat-sidenav-content class="app-shell">
        <mat-toolbar color="primary" class="top-bar">
            <sudoku-toolbar (sidenavOpened)="sidenav.open()"></sudoku-toolbar>
        </mat-toolbar>

        <main class="board-stage">
            <sudoku-grid></sudoku-grid>
        </main>

        <footer class="digit-dock">
            <sudoku-digit></sudoku-digit>
        </footer>
    </mat-sidenav-content>
</mat-sidenav-container>
